<!doctype html>
<html lang="en">
<head>

  <style>
    :root { --black:#0A0A0B; --cream:#F4F1EA; --gold:#C9A96A; --silver:#C0C0C0; }
    * { box-sizing:border-box; margin:0; }
    body { background:var(--black); color:var(--cream); font-family:Georgia,'Times New Roman',serif; min-height:100vh; display:grid; place-items:center; padding:2rem; }

    .rule { width:64px; height:1px; background:var(--gold); margin:1.5rem auto; }

    h1 em { color:var(--gold); font-style:italic; }
    p { color:var(--silver); line-height:1.7; margin-top:1rem; font-family:system-ui,-apple-system,sans-serif; font-size:.95rem; }
    .staff { margin:2rem auto 0; opacity:.7; }
  </style>
</head>
<body>
  <main>
    <p style="letter-spacing:.35em;font-size:.7rem;">♪ · ♫ · ♪</p>
    <h1>Moncef <em>· Violinist</em></h1>

    <p style="margin-top:.5rem;">Deployment check: Cloudflare Pages + www.ohala.qd.je</p>
    <svg class="staff" width="320" height="60" viewBox="0 0 320 60" fill="none" aria-hidden="true">
      <g stroke="#C9A96A" stroke-width="1">

        <line x1="0" y1="34" x2="320" y2="34"/><line x1="0" y1="46" x2="320" y2="46"/>
      </g>

    </svg>
  </main>
</body>
</html>
